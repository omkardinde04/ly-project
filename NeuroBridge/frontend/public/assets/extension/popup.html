<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NeuroBridge</title>
  <style>
    body { width: 260px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 14px; margin: 0; background: #0B1120; color: #fff; }
    h2 { font-size: 15px; margin: 0 0 4px 0; color: #60A5FA; }
    p { font-size: 11px; margin: 0 0 12px 0; color: #94A3B8; }
    .card { background: #1E293B; border-radius: 12px; padding: 10px; margin-bottom: 8px; border: 1px solid #334155; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .row:last-child { margin-bottom: 0; }
    label { font-size: 12px; font-weight: 600; }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: #2563EB; cursor: pointer; }
    .status { font-size: 10px; color: #10B981; font-weight: bold; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h2>NeuroBridge Companion</h2>
  <p>Calibrated from your assessment</p>
  <div class="card">
    <div class="row">
      <label for="toggleFont">OpenDyslexic Font</label>
      <input type="checkbox" id="toggleFont" checked>
    </div>
    <div class="row">
      <label for="toggleRuler">Line-Tracking Ruler</label>
      <input type="checkbox" id="toggleRuler" checked>
    </div>
    <div class="row">
      <label for="toggleTTS">Text-to-Speech</label>
      <input type="checkbox" id="toggleTTS" checked>
    </div>
  </div>
  <div class="status">✓ Profile Active on Page</div>
</body>
</html>
